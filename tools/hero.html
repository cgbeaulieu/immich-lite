<!doctype html>
<!-- The README's hero image: the timeline on a TV, with phone sign-in beside it.
     Rendered to docs/hero.png (transparent background) by tools/hero.sh. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 1600px; height: 1000px; }
  .tv {
    position: absolute; left: 40px; top: 40px; width: 1340px; padding: 16px;
    background: linear-gradient(180deg, #2a2a30 0%, #0d0d10 4%, #0d0d10 96%, #222228 100%);
    border-radius: 22px;
    box-shadow: 0 0 0 2px #3a3a42, 0 40px 80px rgba(0, 0, 0, 0.45), 0 12px 24px rgba(0, 0, 0, 0.35);
  }
  .tv img { display: block; width: 100%; border-radius: 6px; }
  .neck {
    position: absolute; left: 670px; top: 800px; width: 100px; height: 70px;
    background: linear-gradient(90deg, #1a1a1f, #34343c, #1a1a1f);
  }
  .foot {
    position: absolute; left: 520px; top: 866px; width: 400px; height: 16px; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #3a3a42, #121216);
    box-shadow: 0 18px 30px rgba(0, 0, 0, 0.35);
  }
  .phone {
    position: absolute; left: 1250px; top: 300px; width: 300px; padding: 12px;
    background: #0b0b0d; border-radius: 46px;
    box-shadow: 0 0 0 2px #3a3a42, 0 36px 70px rgba(0, 0, 0, 0.5), 0 10px 20px rgba(0, 0, 0, 0.35);
  }
  .phone img { display: block; width: 100%; border-radius: 35px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="neck"></div>
    <div class="foot"></div>
    <div class="tv"><img src="../docs/screenshots/timeline.jpg" alt=""></div>
    <div class="phone"><img src="../docs/screenshots/phone.jpg" alt=""></div>
  </div>
</body>
</html>
