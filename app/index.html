<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Immich-Lite</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="setup" class="screen hidden">
  <div class="panel">
    <h1>Immich-Lite</h1>
    <p class="hint">Connect to your Immich server. Create an API key in Immich under
      Account Settings &rarr; API Keys.</p>
    <label for="server">Server address</label>
    <input id="server" type="text" placeholder="http://192.168.1.10:2283" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="apikey">API key</label>
    <input id="apikey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="connect" type="button">Connect</button>
    <div id="setup-msg" class="msg"></div>
  </div>
</div>

<div id="browse" class="screen hidden">
  <div id="header">
    <div id="tabs"><span class="tab">Photos</span><span class="tab">Explore</span><span class="tab">Map</span><span class="tab">Favorites</span><span class="tab">Albums</span><span class="tab">Search</span><span class="tab">Settings</span><span class="tab play">&#9654; Slideshow</span></div>
    <div id="when"></div>
    <div id="title"></div>
  </div>
  <div id="grid"></div>
  <div id="settings" class="hidden"></div>
  <div id="search" class="hidden"></div>
  <div id="map" class="hidden"></div>
  <div id="status"></div>
</div>

<div id="viewer" class="screen hidden">
  <img id="viewer-img" alt="">
  <div id="viewer-status"></div>
  <div id="viewer-toast" class="hidden"></div>
  <div id="viewer-bar"><span id="viewer-caption"></span><span id="viewer-play"></span></div>
</div>

<script src="js/util.js"></script>
<script src="js/immich.js"></script>
<script src="js/settings.js"></script>
<script src="js/search.js"></script>
<script src="js/map.js"></script>
<script src="js/grid.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
